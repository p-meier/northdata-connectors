[project]
name = "northdata-cli"
version = "0.1.0"
description = "Kommandozeilen-Client für die NorthData-API mit Credit Guard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Patrick Meier", email = "me@patrick-meier.io" }]
keywords = ["northdata", "cli", "company-data", "germany", "b2b", "handelsregister", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
northdata = "northdata_cli.cli:app"

[project.urls]
Homepage = "https://github.com/p-meier/northdata-connectors"
Repository = "https://github.com/p-meier/northdata-connectors"
Issues = "https://github.com/p-meier/northdata-connectors/issues"
Documentation = "https://github.com/p-meier/northdata-connectors/tree/main/northdata-cli#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northdata_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/northdata_cli"]
branch = true
